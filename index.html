<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Que no se te vayan las luces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&family=Titan+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100%;line-height:1.5}
h1,h2,h3,p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit}
.topbar{position:relative;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#190830;color:#fff}
body[data-theme="g1"] .topbar{background:#12203f}
.brand{font-family:'Titan One','Arial Black',Impact,sans-serif;font-size:1rem;display:flex;align-items:center;gap:10px}
body[data-theme="g1"] .brand{font-family:'Bungee',Impact,sans-serif;font-size:.9rem}
.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ffc400;box-shadow:16px 0 0 #e6007e,32px 0 0 #00b3c4;margin-right:32px}
.tools{display:flex;gap:8px}
.icon-btn{background:transparent;border:2px solid #7a5fb0;color:#fff;border-radius:999px;padding:4px 14px;cursor:pointer;font-size:.875rem;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.icon-btn:hover{border-color:#ffc400}
.icon-btn[hidden]{display:none}
.icon-btn:focus-visible{outline:3px solid #ffc400;outline-offset:3px}
.flagrow{height:18px;background:linear-gradient(90deg,#e6007e 0 25%,#ffc400 25% 50%,#00b3c4 50% 75%,#ff6a13 75%)}
.tapebar{height:10px;display:none;background:repeating-linear-gradient(45deg,#ffd21f 0 12px,#12203f 12px 24px)}
body[data-theme="g1"] .flagrow{display:none}
body[data-theme="g1"] .tapebar{display:block}
#app{max-width:980px;margin:0 auto;padding:20px 16px 48px}
/* menu */
.hub h1{font-family:'Titan One','Arial Black',Impact,sans-serif;font-size:clamp(2.2rem,7vw,4rem);line-height:1;text-transform:uppercase;margin:8px 0 12px}
.hub h1 span{color:#ffc400}
.hub .kicker{font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:#ffc400}
.hub .lead{font-size:1.12rem;max-width:56ch;color:#efe7ff}
.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.hubcard{background:#fff;color:#24103f;border:3px solid #24103f;border-radius:22px;overflow:hidden;box-shadow:0 7px 0 #14072a;display:flex;flex-direction:column}
.hubcard .strip{height:16px}
.hubcard.a1 .strip{background:linear-gradient(90deg,#e6007e 0 25%,#ffc400 25% 50%,#00b3c4 50% 75%,#ff6a13 75%)}
.hubcard.a2 .strip{background:repeating-linear-gradient(45deg,#ffd21f 0 12px,#12203f 12px 24px)}
.hubcard .body{padding:18px;display:flex;flex-direction:column;gap:12px;flex:1}
.hubcard .num{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#5b4a7a}
.hubcard h2{font-family:'Titan One','Arial Black',Impact,sans-serif;font-weight:400;font-size:1.6rem;line-height:1.05;text-transform:uppercase}
.hubcard.a2 h2{font-family:'Bungee',Impact,sans-serif;font-size:1.4rem}
.hubcard .art{display:grid;place-items:center;height:150px;border-radius:14px}
.hubcard.a1 .art{background:#2a0f4a}
.hubcard.a2 .art{background:#eaf4ff}
.hubcard .art svg{height:130px;width:auto}
.hubcard ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.hubcard li{font-size:.8rem;font-weight:700;border:2px solid #24103f;border-radius:999px;padding:2px 10px;background:#fff7cc}
.hbtn{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;border:3px solid #24103f;background:#ffc400;color:#24103f;font-family:'Titan One','Arial Black',Impact,sans-serif;font-size:1.05rem;padding:12px 24px;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 #24103f;transition:transform .08s,box-shadow .08s}
.hbtn:hover{transform:translateY(-1px)}
.hbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #24103f}
.hbtn:focus-visible{outline:3px solid #24103f;outline-offset:3px}
.hub .foot{margin-top:26px;color:#cfc0ee;font-size:.9rem;max-width:80ch}
@media (max-width:760px){.hubgrid{grid-template-columns:1fr}}
.icon-btn{white-space:nowrap}
.brand span{line-height:1.1}
@media (max-width:520px){.brand i{display:none}.brand{font-size:.85rem}body[data-theme="g1"] .brand{font-size:.78rem}.icon-btn{padding:4px 10px;font-size:.8rem}.topbar{padding:10px 12px}}
.g1,.g2{display:block}
.g1 :focus-visible{outline:3px solid #12203f;outline-offset:3px;border-radius:6px}
.g2 :focus-visible{outline:3px solid #ffc400;outline-offset:3px;border-radius:8px}
.g1{
  --ink:#12203f;
  --volt:#ffd21f;
  --alert:#e8392a;
  --safe:#0f9b80;
  --paper:#eaf4ff;
  --card:#ffffff;
  --muted:#4a5878;
  --line:#c9d6ea;
  --font-display:'Bungee',Impact,'Arial Black',sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
.g1 *{box-sizing:border-box}
body[data-theme="g1"]{background:#eaf4ff;color:#12203f;font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1.0625rem;line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px,#c9dbf2 1px,transparent 0);background-size:22px 22px;min-height:100%}
.g1 h1,.g1 h2,.g1 h3{margin:0;text-wrap:balance}
.g1 p{margin:0}
.g1 button{font-family:inherit;font-size:inherit;color:inherit}
.g1 :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.g1 .tape{background:repeating-linear-gradient(45deg,var(--volt) 0 12px,var(--ink) 12px 24px)}
.g1 .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);background:var(--volt);color:var(--ink);
  font-family:var(--font-display);font-size:1rem;letter-spacing:.02em;padding:12px 22px;border-radius:12px;cursor:pointer;box-shadow:0 5px 0 var(--ink);
  transition:transform .08s,box-shadow .08s}
.g1 .btn:hover{transform:translateY(-1px)}
.g1 .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.g1 .btn-ghost{background:#fff;font-size:.85rem;padding:8px 14px;box-shadow:0 3px 0 var(--ink)}
.g1 .btn-ghost[disabled]{opacity:.45;cursor:not-allowed}
.g1 .btn-dark{background:var(--ink);color:#fff}
.g1 .btn-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
.g1 .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.g1 .kicker{font-weight:700;font-size:.875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.g1 .hero h1{font-family:var(--font-display);font-size:clamp(2rem,6vw,3.6rem);line-height:1.02;margin:8px 0 14px;text-transform:uppercase}
.g1 .lit{background:var(--volt);padding:0 .15em;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:6px}
.g1 .lead{font-size:1.15rem;max-width:56ch}
.g1 .panel{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:18px;box-shadow:0 6px 0 var(--ink)}
.g1 .form{margin-top:20px;display:grid;gap:16px}
.g1 .field label.lbl{display:block;font-weight:700;margin-bottom:6px}
.g1 .field input[type=text]{width:100%;padding:12px 14px;font:inherit;border:3px solid var(--ink);border-radius:10px;background:#fff}
.g1 .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g1 .mode{position:relative}
.g1 .mode input{position:absolute;opacity:0;inset:0;cursor:pointer}
.g1 .mode span{display:block;border:3px solid var(--line);border-radius:12px;padding:12px;background:#fff;height:100%}
.g1 .mode b{display:block;font-family:var(--font-display);font-size:.95rem}
.g1 .mode small{color:var(--muted);font-size:.875rem;display:block;margin-top:2px}
.g1 .mode input:checked + span{border-color:var(--ink);background:#fff7cc;box-shadow:0 4px 0 var(--ink)}
.g1 .mode input:focus-visible + span{outline:3px solid var(--ink);outline-offset:3px}
.g1 .hero-art{display:flex;flex-direction:column;align-items:center;gap:14px}
.g1 .glow{position:relative;width:min(260px,60vw);aspect-ratio:1;display:grid;place-items:center}
.g1 .glow::before{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,#ffe66b 0%,rgba(255,230,107,.0) 68%);animation:pulse 2.6s ease-in-out infinite}
.g1 .chispa{position:relative;width:78%;height:auto;display:block}
.g1 .bubble{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 16px;max-width:34ch;position:relative;text-align:center}
.g1 .bubble::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}
.g1 .how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
.g1 .how .panel{box-shadow:0 4px 0 var(--ink)}
.g1 .how .n{font-family:var(--font-display);background:var(--ink);color:var(--volt);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px}
.g1 .how h3{font-family:var(--font-display);font-size:1rem;margin-bottom:4px}
.g1 .foot{margin-top:28px;color:var(--muted);font-size:.9rem;max-width:80ch}
.g1 .intro{max-width:640px;margin:10px auto 0}
.g1 .intro h2,.g1 .result h2,.g1 .quiz h2{font-family:var(--font-display);font-size:clamp(1.5rem,4.5vw,2.2rem);text-transform:uppercase;line-height:1.1}
.g1 .pill{display:inline-block;background:var(--ink);color:var(--volt);font-family:var(--font-display);font-size:.8rem;padding:4px 12px;border-radius:999px;margin-bottom:10px}
.g1 .intro ul{padding-left:20px;margin:12px 0 0}
.g1 .tip{display:flex;gap:12px;align-items:center;margin-top:16px;background:#fff7cc;border:3px solid var(--ink);border-radius:14px;padding:10px 14px}
.g1 .tip svg{width:48px;height:auto;flex:none}
.g1 .hud{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px 16px;align-items:center;margin-bottom:12px}
.g1 .hud-level{display:flex;flex-direction:column;line-height:1.15}
.g1 .hud-level .lv{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.g1 .hud-level strong{font-family:var(--font-display);font-size:1.05rem}
.g1 .bulbs{display:flex;gap:4px}
.g1 .bulb{width:26px;height:32px;color:var(--volt);transition:color .3s}
.g1 .bulb path,.g1 .bulb rect{stroke:var(--ink);stroke-width:1.6}
.g1 .bulb.off{color:#cfd7e6}
.g1 .found{font-weight:700;text-align:right}
.g1 .found b{font-family:var(--font-display);font-size:1.2rem}
.g1 .clockrow{grid-column:1 / -1;display:flex;align-items:center;gap:10px}
.g1 .clock-bar{flex:1;height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.g1 .clock-bar i{display:block;height:100%;width:100%;background:var(--safe);transition:width .2s linear,background .3s}
.g1 .clock-bar i.low{background:var(--alert)}
.g1 #clockT{font-family:var(--font-display);min-width:3.2ch;text-align:right}
.g1 .sceneframe{padding:10px;border-radius:16px;border:3px solid var(--ink)}
.g1 #scene{display:block;width:100%;height:auto;border-radius:8px;background:#fff;touch-action:manipulation}
.g1 .spot{cursor:pointer}
.g1 .spot:focus-visible{outline:none}
.g1 .spot:focus-visible .ring{opacity:1;stroke:var(--ink);stroke-dasharray:6 5}
.g1 .mark{opacity:0;transition:opacity .25s}
.g1 .ring{fill:rgba(15,155,128,.12);stroke:var(--safe);stroke-width:4;stroke-dasharray:8 6}
.g1 .badge circle{fill:var(--safe);stroke:#fff;stroke-width:3}
.g1 .badge path{stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.g1 .spot.found .mark{opacity:1}
.g1 .spot.flag .mark{opacity:1}
.g1 .spot.flag .ring{stroke:#2b6fe0;fill:rgba(43,111,224,.1)}
.g1 .spot.flag .badge circle{fill:#2b6fe0}
.g1 .spot.hint .mark{opacity:1}
.g1 .spot.hint .badge{opacity:0}
.g1 .spot.hint .ring{stroke:var(--alert);fill:rgba(232,57,42,.12);animation:pulseRing 0.9s ease-in-out infinite}
.g1 .ripple{fill:none;stroke:var(--ink);stroke-width:3;animation:rip .6s ease-out forwards;pointer-events:none}
.g1 .scenehelp{margin-top:10px;color:var(--muted);font-size:.95rem}
.g1 .sheet{position:fixed;inset:0;background:rgba(18,32,63,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:50}
.g1 .sheet[hidden]{display:none}
.g1 .sheet-card{background:#fff;border:3px solid var(--ink);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 8px 0 var(--ink)}
.g1 .sheet-top{padding:8px 18px;font-family:var(--font-display);font-size:.85rem;display:flex;justify-content:space-between;gap:10px}
.g1 .sheet-top.good{background:var(--volt);color:var(--ink)}
.g1 .sheet-top.info{background:#2b6fe0;color:#fff}
.g1 .sheet-body{padding:16px 18px 20px;display:grid;gap:12px}
.g1 .sheet-body h3{font-family:var(--font-display);font-size:1.3rem;line-height:1.1;text-transform:uppercase}
.g1 .sheet-body h4{margin:0 0 2px;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.g1 .box-do{background:#e2f6f1;border:3px solid var(--safe);border-radius:12px;padding:10px 14px}
.g1 .box-do h4{color:var(--safe)}
.g1 .box-tech{border:3px dashed var(--ink);border-radius:12px;padding:10px 14px;background:#f5f8ff}
.g1 .result{max-width:720px;margin:0 auto}
.g1 .result-head{padding:18px;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 6px 0 var(--ink)}
.g1 .result-head.win{background:#fff7cc}
.g1 .result-head.lost{background:#ffe1dc}
.g1 .stars{display:flex;gap:6px;margin:14px 0}
.g1 .stars svg{width:44px;height:44px}
.g1 .stars .on{fill:var(--volt);stroke:var(--ink);stroke-width:2.5}
.g1 .stars .off{fill:#dfe5f0;stroke:#9aa7c0;stroke-width:2.5}
.g1 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
.g1 .stats div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;text-align:center}
.g1 .stats b{display:block;font-family:var(--font-display);font-size:1.4rem}
.g1 .stats span{font-size:.85rem;color:var(--muted)}
.g1 .review{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px}
.g1 .review details{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 14px}
.g1 .review summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.g1 .review p{margin-top:8px}
.g1 .chip{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px;border:2px solid var(--ink)}
.g1 .chip.ok{background:#c9f0e6}
.g1 .chip.miss{background:#ffd3cc}
.g1 h3.sec{font-family:var(--font-display);font-size:1.1rem;margin-top:22px;text-transform:uppercase}
.g1 .quiz{max-width:720px;margin:0 auto}
.g1 .progress{height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:12px 0 18px}
.g1 .progress i{display:block;height:100%;background:var(--volt);border-right:3px solid var(--ink)}
.g1 .qtext{font-size:1.25rem;font-weight:700;margin-bottom:14px}
.g1 .opts{display:grid;gap:10px}
.g1 .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.g1 .opt:hover{background:#fff7cc}
.g1 .opt .k{font-family:var(--font-display);background:var(--ink);color:var(--volt);min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.g1 .opt.right{background:#c9f0e6;border-color:var(--safe)}
.g1 .opt.wrong{background:#ffd3cc;border-color:var(--alert)}
.g1 .opt[disabled]{cursor:default}
.g1 .explain{margin-top:14px}
.g1 .diploma{border:6px double var(--ink);background:#fffdf0;border-radius:6px;padding:24px 18px;text-align:center;box-shadow:0 6px 0 var(--ink)}
.g1 .diploma .small{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.g1 .diploma .name{font-family:var(--font-display);font-size:clamp(1.6rem,5vw,2.4rem);margin:6px 0;line-height:1.1;overflow-wrap:anywhere}
.g1 .diploma .rank{display:inline-block;background:var(--ink);color:var(--volt);font-family:var(--font-display);padding:6px 16px;border-radius:999px;margin:10px 0}
.g1 .diploma svg{width:70px;height:auto;margin:0 auto 6px;display:block}
.g1 .copybox{width:100%;margin-top:10px;font:inherit;padding:10px;border:3px solid var(--ink);border-radius:10px;min-height:80px}
.g1 .copymsg{margin-top:8px;font-weight:700;color:var(--safe)}
@keyframes pulse{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.06);opacity:1}}
@keyframes pulseRing{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rip{from{r:4;opacity:.9}to{r:34;opacity:0}}
@media (prefers-reduced-motion:reduce){.g1 *{animation:none!important;transition:none!important}}
@media (max-width:760px){.g1 .hero{grid-template-columns:1fr}
.g1 .hero-art{order:-1}
.g1 .glow{width:min(170px,50vw)}
.g1 .how{grid-template-columns:1fr}
.g1 .hud{grid-template-columns:1fr auto}
.g1 .hud-level{grid-column:1}
.g1 .bulbs{grid-column:2;justify-self:end}
.g1 .found{text-align:left}
.g1 .modes{grid-template-columns:1fr}}
.g2{
  --night:#2a0f4a;
  --night2:#3d1768;
  --magenta:#e6007e;
  --turq:#00b3c4;
  --sun:#ffc400;
  --orange:#ff6a13;
  --card:#ffffff;
  --ink:#24103f;
  --muted:#5b4a7a;
  --font-display:'Titan One','Arial Black',Impact,sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
.g2 *{box-sizing:border-box}
body[data-theme="g2"],body[data-theme="hub"]{background:#2a0f4a;color:#fff;font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1.0625rem;line-height:1.5;min-height:100%;
  background-image:
   radial-gradient(circle at 12% 18%,#e6007e 0 3px,transparent 4px),
   radial-gradient(circle at 78% 12%,#ffc400 0 3px,transparent 4px),
   radial-gradient(circle at 40% 70%,#00b3c4 0 3px,transparent 4px),
   radial-gradient(circle at 90% 80%,#ff6a13 0 3px,transparent 4px);
  background-size:260px 260px,310px 310px,230px 230px,290px 290px}
.g2 h1,.g2 h2,.g2 h3{margin:0;text-wrap:balance}
.g2 p{margin:0}
.g2 button{font-family:inherit;font-size:inherit;color:inherit}
.g2 :focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:8px}
.g2 .card :focus-visible,.g2 .sheet-card :focus-visible{outline-color:var(--ink)}
.g2 .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);background:var(--sun);color:var(--ink);
  font-family:var(--font-display);font-size:1.05rem;padding:12px 24px;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.g2 .btn:hover{transform:translateY(-1px)}
.g2 .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.g2 .btn-alt{background:#fff;font-size:.9rem;padding:9px 18px;box-shadow:0 3px 0 var(--ink)}
.g2 .btn-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
.g2 .card{background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 6px 0 #14072a}
.g2 .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.g2 .kicker{font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--sun)}
.g2 .hero h1{font-family:var(--font-display);font-size:clamp(2.4rem,8vw,4.6rem);line-height:.98;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.01em}
.g2 .hero h1 span{color:var(--sun)}
.g2 .sub{font-family:var(--font-display);font-size:1.2rem;color:var(--turq);margin-bottom:12px}
.g2 .lead{font-size:1.12rem;max-width:56ch;color:#efe7ff}
.g2 .form{margin-top:20px;display:grid;gap:16px}
.g2 .lbl{display:block;font-weight:700;margin-bottom:6px}
.g2 .field input[type=text]{width:100%;padding:12px 14px;font:inherit;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.g2 .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2 .mode{position:relative;color:var(--ink)}
.g2 .mode input{position:absolute;opacity:0;inset:0;cursor:pointer}
.g2 .mode > span{display:block;border:3px solid #cdbfe8;border-radius:14px;padding:12px;background:#fff;height:100%}
.g2 .mode b{display:block;font-family:var(--font-display);font-size:1rem;font-weight:400}
.g2 .mode small{color:var(--muted);font-size:.875rem;display:block;margin-top:2px}
.g2 .mode .row{display:flex;gap:10px;align-items:center}
.g2 .mode .row svg{width:46px;height:auto;flex:none}
.g2 .mode input:checked + span{border-color:var(--magenta);background:#ffe9f4;box-shadow:0 4px 0 var(--magenta)}
.g2 .mode input:focus-visible + span{outline:3px solid var(--sun);outline-offset:3px}
.g2 .hero-art{display:flex;flex-direction:column;align-items:center;gap:14px}
.g2 .glow{position:relative;width:min(300px,64vw);aspect-ratio:1;display:grid;place-items:center}
.g2 .glow::before{content:"";position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(circle,rgba(255,196,0,.6) 0%,rgba(255,196,0,0) 68%);animation:pulse 2.6s ease-in-out infinite}
.g2 .chispa{position:relative;width:88%;height:auto;display:block;animation:sway 2.2s ease-in-out infinite;transform-origin:50% 90%}
.g2 .bubble{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;max-width:34ch;position:relative;text-align:center}
.g2 .bubble::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}
.g2 .how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}
.g2 .how .card{box-shadow:0 4px 0 #14072a}
.g2 .how .n{font-family:var(--font-display);background:var(--magenta);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px}
.g2 .how h3{font-family:var(--font-display);font-weight:400;font-size:1.1rem;margin-bottom:4px}
.g2 .foot{margin-top:26px;color:#cfc0ee;font-size:.9rem;max-width:80ch}
.g2 .stage{max-width:440px;margin:0 auto}
.g2 .hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 12px;align-items:center;margin-bottom:10px}
.g2 .hud .tramo{line-height:1.15}
.g2 .hud .tramo small{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#cfc0ee}
.g2 .hud .tramo b{font-family:var(--font-display);font-weight:400;font-size:1rem}
.g2 .bulbs{display:flex;gap:3px;justify-content:center}
.g2 .bulb{width:24px;height:30px;color:var(--sun);transition:color .3s}
.g2 .bulb.off{color:#5b4580}
.g2 .hud .stat{text-align:right;font-size:.9rem;line-height:1.2}
.g2 .hud .stat b{font-family:var(--font-display);font-weight:400;font-size:1.05rem;color:var(--sun)}
.g2 .canvaswrap{position:relative;border:4px solid #fff;border-radius:18px;overflow:hidden;background:#14072a;box-shadow:0 0 0 4px var(--magenta)}
.g2 #cv{display:block;width:100%;height:auto;aspect-ratio:400/640;touch-action:none;max-height:calc(100vh - 250px);margin:0 auto}
.g2 .toast{position:absolute;left:10px;right:10px;top:34px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:.92rem;line-height:1.3;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
.g2 .toast.on{opacity:1;transform:none}
.g2 .toast b{color:var(--magenta)}
.g2 .controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-top:12px;align-items:center}
.g2 .arrow{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:18px;height:58px;font-family:var(--font-display);font-size:1.6rem;cursor:pointer;box-shadow:0 5px 0 var(--ink);touch-action:manipulation}
.g2 .arrow:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.g2 .help{margin-top:10px;color:#cfc0ee;font-size:.9rem;text-align:center}
.g2 .sheet{position:fixed;inset:0;background:rgba(20,7,42,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:50}
.g2 .sheet[hidden]{display:none}
.g2 .sheet-card{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;max-width:580px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 8px 0 #14072a}
.g2 .sheet-top{padding:8px 18px;font-family:var(--font-display);font-size:.9rem;background:var(--magenta);color:#fff;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.g2 .sheet-top.ok{background:var(--turq)}
.g2 .sheet-top.bad{background:var(--orange)}
.g2 .sheet-body{padding:16px 18px 20px;display:grid;gap:12px}
.g2 .sheet-body h3{font-family:var(--font-display);font-weight:400;font-size:1.35rem;line-height:1.1;text-transform:uppercase}
.g2 .sheet-body h4{margin:0 0 2px;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.g2 .scn{display:flex;gap:12px;align-items:flex-start}
.g2 .scn svg{width:54px;height:auto;flex:none}
.g2 .opts{display:grid;gap:10px}
.g2 .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;cursor:pointer;width:100%;color:var(--ink)}
.g2 .opt:hover{background:#fff3c4}
.g2 .opt .k{font-family:var(--font-display);background:var(--ink);color:var(--sun);min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.g2 .opt.right{background:#c8f3f6;border-color:var(--turq)}
.g2 .opt.wrong{background:#ffd8c2;border-color:var(--orange)}
.g2 .opt[disabled]{cursor:default}
.g2 .box-do{background:#e5f8fa;border:3px solid var(--turq);border-radius:14px;padding:10px 14px}
.g2 .box-do h4{color:#00727d}
.g2 .box-tech{border:3px dashed var(--ink);border-radius:14px;padding:10px 14px;background:#f7f2ff}
.g2 .result{max-width:720px;margin:0 auto}
.g2 .result h2{font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,5vw,2.4rem);text-transform:uppercase;line-height:1.05}
.g2 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.g2 .stats div{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;text-align:center}
.g2 .stats b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.4rem}
.g2 .stats span{font-size:.85rem;color:var(--muted)}
.g2 .diploma{background:#fffdf3;color:var(--ink);border:6px double var(--ink);border-radius:8px;padding:24px 18px;text-align:center;box-shadow:0 6px 0 #14072a}
.g2 .diploma .small{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.g2 .diploma .name{font-family:var(--font-display);font-size:clamp(1.7rem,5vw,2.6rem);margin:6px 0;line-height:1.1;overflow-wrap:anywhere;color:var(--magenta)}
.g2 .diploma .rank{display:inline-block;background:var(--ink);color:var(--sun);font-family:var(--font-display);padding:6px 18px;border-radius:999px;margin:10px 0}
.g2 .diploma .chispa{width:110px;animation:none;margin:0 auto}
.g2 h3.sec{font-family:var(--font-display);font-weight:400;font-size:1.2rem;margin:26px 0 8px;text-transform:uppercase;color:var(--sun)}
.g2 .review{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.g2 .review details{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 14px}
.g2 .review summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.g2 .review p{margin-top:8px}
.g2 .chip{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px;border:2px solid var(--ink)}
.g2 .chip.ok{background:#c8f3f6}
.g2 .chip.miss{background:#ffd8c2}
.g2 .copybox{width:100%;margin-top:10px;font:inherit;padding:10px;border:3px solid var(--ink);border-radius:12px;min-height:80px;color:var(--ink)}
.g2 .copymsg{margin-top:8px;font-weight:700;color:var(--turq)}
.g2 .panel-w{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 16px}
@keyframes pulse{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.06);opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.g2 *{animation:none!important;transition:none!important}}
@media (max-width:760px){.g2 .hero{grid-template-columns:1fr}
.g2 .hero-art{order:-1}
.g2 .glow{width:min(190px,52vw)}
.g2 .how{grid-template-columns:1fr}
.g2 .modes{grid-template-columns:1fr}}
</style>
</head>

{t:'Ley de Ohm',q:'Con el mismo voltaje, una persona se moja las manos y su resistencia baja. ¿Qué pasa con la corriente (I = V / R)?',o:['Aumenta','Disminuye','Se queda igual','Se vuelve cero'],c:0,e:'Si R baja y V es igual, I = V / R sube. Por eso con las manos mojadas un choque es más peligroso.'},

{t:'Calle',q:'Ves un cable de energía caído en un charco. ¿Qué haces?',o:['Lo aparto con un palo de escoba','Me quedo lejos, no dejo pasar a nadie y llamo al 123 y a la empresa de energía','Lo piso con botas de caucho','Lo toco rápido para ver si tiene corriente'],c:1,e:'Un cable caído puede tener corriente aunque no haga chispas. No lo toques con nada: aléjate y pide ayuda.'},
{t:'Escuela',q:'La pelota quedó atrapada en los cables del poste del patio. ¿Qué haces?',o:['Trepo rápido por ella','Le tiro una piedra','La dejo y aviso a un adulto','Uso una varilla de hierro'],c:2,e:'Cerca de la red puede haber descarga aunque no toques el cable. Una pelota se reemplaza, una vida no.'},
{t:'Casa',q:'Un cable de la lámpara tiene el cobre a la vista y alguien le puso cinta. ¿Qué haces?',o:['Sigo usándola, la cinta lo arregla','Pido a un adulto que lo desconecte y cambie el cable','Lo toco para comprobar','Lo meto debajo del tapete'],c:1,e:'La cinta no devuelve el aislamiento. Hay que cambiar el cable.'},
{t:'Casa',q:'Una plancha, una licuadora y un ventilador están en un solo adaptador. ¿Por qué es peligroso?',o:['Porque gasta más espacio','Porque el adaptador y los cables se sobrecargan y se calientan','Porque los aparatos se ponen celosos','No es peligroso'],c:1,e:'Cada toma y cable soportan una corriente máxima. Si la superas, se recalienta y puede haber incendio.'},
{t:'Primeros auxilios',q:'Después de un choque la quemadura se ve pequeña. ¿Qué haces?',o:['Nada, es pequeña','Se lo cuento a un adulto y voy al médico, porque el daño puede estar por dentro','Le pongo pasta de dientes','Me aguanto sin decir nada'],c:1,e:'La corriente puede dañar tejidos y el corazón por dentro. Siempre se revisa con un médico.'}
];
const MODES={explorer:{label:'Explorador',time:100,hints:2},engineer:{label:'Ingeniero',time:60,hints:0}};
const NSP=l=>l.spots.filter(s=>s.type==='hazard').length;

/* ---------- estado ---------- */
const S={name:'',mode:'explorer',li:0,best:[null,null,null],quiz:null};
let P=null,timer=null,sheetCb=null,muted=false,AC=null;
const screen=$('#screen'),sheet=$('#sheet1');
function show(h){stopTimer();screen.innerHTML='<div class="g1">'+h+'</div>';window.scrollTo(0,0)}

/* ---------- sonido ---------- */
function tone(seq){
  if(window.CS&&CS.muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9});}catch(e){}
}
const sfx={ok:()=>tone([[660,.1],[880,.16]]),bad:()=>tone([[300,.14],[200,.22]]),win:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.28]]),lose:()=>tone([[330,.18],[247,.18],[196,.3]])};

/* ---------- piezas de interfaz ---------- */
const chispa=(cls='chispa')=>`<svg class="${cls}" viewBox="0 0 120 152" aria-hidden="true"><use href="#chispa1"/></svg>`;
const bulbSvg=on=>`<svg class="bulb ${on?'':'off'}" viewBox="0 0 24 30" aria-hidden="true"><use href="#bulbico1"/></svg>`;
const star=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on?'on':'off'}" d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.5 6 20.9l1.3-6.7-5-4.7 6.8-.8Z" stroke-linejoin="round"/></svg>`;

/* ---------- inicio ---------- */
function showStart(){
  S.li=0;S.best=[null,null,null];S.quiz=null;if(window.CS){S.name=CS.name||S.name;S.mode=CS.mode||S.mode}
  show(`<section class="hero">
  <div>
    <p class="kicker">Juego de seguridad eléctrica</p>
    <h1>¡Que no se te <span class="lit">vayan las luces!</span></h1>
    <p class="lead">Recorre una casa, una calle y una escuela. Encuentra los riesgos eléctricos antes de que se acabe el tiempo. Cada error te cuesta una luz.</p>
    <form class="form" id="startForm" autocomplete="off">
      <div class="field"><label class="lbl" for="pname">¿Cómo te llamas?</label><input type="text" id="pname" maxlength="24" placeholder="Tu nombre" value="${esc(S.name)}"></div>
      <div class="field"><span class="lbl" id="modeLbl">Elige tu modo</span>
        <div class="modes" role="radiogroup" aria-labelledby="modeLbl">
          <label class="mode"><input type="radio" name="mode" value="explorer" ${S.mode==='explorer'?'checked':''}><span><b>Explorador</b><small>Para niños. 100 segundos y 2 pistas.</small></span></label>
          <label class="mode"><input type="radio" name="mode" value="engineer" ${S.mode==='engineer'?'checked':''}><span><b>Ingeniero</b><small>Para adolescentes. 60 segundos, sin pistas y con datos técnicos.</small></span></label>
        </div></div>
      <div><button class="btn" type="submit">Jugar</button></div>
    </form>
  </div>
  <div class="hero-art"><div class="glow">${chispa()}</div><p class="bubble">Soy Chispa. Te ayudo a encontrar los riesgos y a saber qué hacer en cada caso.</p></div>
</section>
<section class="how" aria-label="Cómo se juega">
  <div class="panel"><div class="n">1</div><h3>Busca</h3><p>Toca los objetos que creas peligrosos en cada escena. Ojo: algunos son seguros.</p></div>
  <div class="panel"><div class="n">2</div><h3>Aprende</h3><p>Cada hallazgo te explica qué puede pasar y cuál es la forma segura de actuar.</p></div>
  <div class="panel"><div class="n">3</div><h3>Demuestra</h3><p>Al final respondes 10 preguntas y recibes tu diploma de seguridad eléctrica.</p></div>
</section>
<p class="foot">Inspirado en la campaña “Que no se te vayan las luces” del CIDET, la Universidad del Norte y el grupo IEEE. En una emergencia en Colombia, llama al 123.</p>`);
  $('#startForm').addEventListener('submit',e=>{e.preventDefault();S.name=$('#pname').value.trim();S.mode=(document.querySelector('input[name=mode]:checked')||{}).value||'explorer';CS.name=S.name;CS.mode=S.mode;showIntro(0)});
}

/* ---------- introducción de nivel ---------- */
function showIntro(i){
  S.li=i;const L=LEVELS[i],M=MODES[S.mode],n=NSP(L);
  show(`<section class="intro panel">
  <span class="pill">Nivel ${i+1} de 3</span>
  <h2>${L.name}</h2>
  <ul><li>Encuentra <b>${n} riesgos</b> eléctricos tocándolos en la escena.</li>
  <li>Hay <b>${L.spots.length-n} cosas seguras</b>. Si las señalas, se apaga una luz.</li>
  <li>Tienes <b>3 luces</b> y <b>${M.time} segundos</b>${M.hints?` y ${M.hints} pistas`:''}.</li></ul>
  <div class="tip">${chispa('chispa')}<p><b>Consejo de Chispa:</b> ${L.tip}</p></div>
  <div class="btn-row"><button class="btn" id="go" type="button">Empezar</button></div>
</section>`);
  $('#go').addEventListener('click',startLevel);
}

/* ---------- nivel ---------- */
function sceneSVG(L){
  const spots=L.spots.map(s=>{const h=s.hits[0];
    return `<g class="spot" data-id="${s.id}" tabindex="0" role="button" aria-label="Revisar: ${esc(s.label)}">${s.art}
    ${s.hits.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="transparent"/>`).join('')}
    <g class="mark"><circle class="ring" cx="${h[0]}" cy="${h[1]}" r="${h[2]}"/><g class="badge" transform="translate(${h[0]+h[2]*.62},${h[1]-h[2]*.62})"><circle r="15"/><path d="M-7 0L-2 5L8 -5"/></g></g></g>`}).join('');
  return `<svg id="scene" viewBox="0 0 800 480" role="group" aria-label="Escena: ${L.name}">${L.bg}${spots}</svg>`;
}
function hudHTML(){
  const L=LEVELS[S.li];
  return `<div class="hud"><div class="hud-level"><span class="lv">Nivel ${S.li+1} de 3</span><strong>${L.name}</strong></div>
  <div class="bulbs" id="bulbs" role="img" aria-label="Luces restantes"></div>
  <div class="found" aria-live="polite">Riesgos <b id="foundN">0</b> de ${NSP(L)}</div>
  <div class="clockrow"><div class="clock-bar"><i id="clockBar"></i></div><span id="clockT"></span><button class="btn btn-ghost" id="hintBtn" type="button"></button></div></div>`;
}
function startLevel(){
  const L=LEVELS[S.li],M=MODES[S.mode];
  show(hudHTML()+`<div class="sceneframe tape">${sceneSVG(L)}</div><p class="scenehelp">Toca un objeto para revisarlo. Si tocas un lugar vacío no pasa nada.</p>`);
  P={found:new Set(),flag:new Set(),bulbs:3,t:M.time,max:M.time,hints:M.hints,score:0,paused:false,over:false,wrong:0};
  updateHUD();
  timer=setInterval(tick,200);
  const svg=$('#scene');
  svg.addEventListener('click',e=>{
    const sp=e.target.closest('.spot');
    if(sp){onSpot(sp.dataset.id);return}
    if(P&&!P.paused&&!P.over)ripple(e,svg);
  });
  svg.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('spot')){e.preventDefault();onSpot(e.target.dataset.id)}});
  $('#hintBtn').addEventListener('click',useHint);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function tick(){
  if(!P||P.paused||P.over)return;
  P.t=Math.max(0,P.t-0.2);updateHUD();
  if(P.t<=0)finishLevel('time');
}
function updateHUD(){
  if(!P)return;
  const b=$('#bulbs');if(b)b.innerHTML=[0,1,2].map(i=>bulbSvg(i<P.bulbs)).join('');
  const f=$('#foundN');if(f)f.textContent=P.found.size;
  const bar=$('#clockBar');if(bar){bar.style.width=(P.t/P.max*100)+'%';bar.classList.toggle('low',P.t<=15)}
  const ct=$('#clockT');if(ct)ct.textContent=Math.ceil(P.t)+' s';
  const h=$('#hintBtn');if(h){const hasHints=MODES[S.mode].hints>0;h.style.display=hasHints?'':'none';h.textContent='Pista ('+P.hints+')';h.disabled=P.hints<=0||P.over}
}
function ripple(e,svg){
  try{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','ripple');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',4);svg.appendChild(c);setTimeout(()=>c.remove(),650)}catch(err){}
}
function useHint(){
  if(!P||P.over||P.paused||P.hints<=0)return;
  const L=LEVELS[S.li];const left=L.spots.filter(s=>s.type==='hazard'&&!P.found.has(s.id));
  if(!left.length)return;
  const s=left[Math.floor(Math.random()*left.length)];const el=document.querySelector(`.spot[data-id="${s.id}"]`);
  if(el){el.classList.add('hint');setTimeout(()=>el.classList.remove('hint'),3000)}
  P.hints--;updateHUD();
}
function onSpot(id){
  if(!P||P.over||P.paused)return;
  const L=LEVELS[S.li],s=L.spots.find(x=>x.id===id),el=document.querySelector(`.spot[data-id="${id}"]`);
  const again=P.found.has(id)||P.flag.has(id);
  if(s.type==='hazard'){
    if(!again){P.found.add(id);P.score+=100;el.classList.add('found');sfx.ok();updateHUD()}
    openSheet('good',again?'Ya lo encontraste':'¡Riesgo encontrado!'+(again?'':'  +100'),
      `<h3>${s.title}</h3><div><h4>¿Qué puede pasar?</h4><p>${s.why}</p></div><div class="box-do"><h4>Lo seguro</h4><p>${s.do}</p></div>${(S.mode==='engineer'&&s.tech)?`<div class="box-tech"><h4>Dato técnico</h4><p>${s.tech}</p></div>`:''}`,afterSheet);
  }else{
    if(!again){P.flag.add(id);P.bulbs--;P.wrong++;P.score=Math.max(0,P.score-50);el.classList.add('flag');sfx.bad();updateHUD()}
    openSheet('info',again?'Esto es seguro':'Esto es seguro  -1 luz',
      `<h3>${s.title}</h3><div><p>${s.why}</p></div><p>Buen ojo al dudar, pero esto no es un riesgo. Sigue buscando.</p>`,afterSheet);
  }
}
function afterSheet(){
  if(!P||P.over)return;
  if(P.found.size>=NSP(LEVELS[S.li]))finishLevel('win');
  else if(P.bulbs<=0)finishLevel('bulbs');
}
function openSheet(kind,top,body,cb){
  if(P)P.paused=true;sheetCb=cb;
  $('#sheetTop1').className='sheet-top '+kind;$('#sheetTop1').textContent=top;
  $('#sheetBody1').innerHTML=body+'<div><button class="btn" type="button" id="sheetOk">Seguir</button></div>';
  $('#sheetBody1 h3').id='sheetTitle';
  sheet.hidden=false;$('#sheetOk').focus();
}
function closeSheet(){
  if(sheet.hidden)return;sheet.hidden=true;if(P)P.paused=false;
  const cb=sheetCb;sheetCb=null;if(cb)cb();
}
sheet.addEventListener('click',e=>{if(e.target.id==='sheetOk'||e.target===sheet)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(P&&!P.over&&document.hidden)P.paused=true;else if(P&&!P.over&&sheet.hidden)P.paused=false});

/* ---------- fin de nivel ---------- */
function finishLevel(reason){
  if(!P||P.over)return;P.over=true;stopTimer();
  const L=LEVELS[S.li],n=NSP(L),found=P.found.size;
  const timeBonus=reason==='win'?Math.round(P.t)*2:0;
  const score=Math.max(0,P.score+timeBonus);
  const stars=(found===n&&P.bulbs>=2)?3:(found>=Math.ceil(n*.66)?2:(found>=2?1:0));
  const res={found:[...P.found],missed:L.spots.filter(s=>s.type==='hazard'&&!P.found.has(s.id)).map(s=>s.id),bulbs:P.bulbs,score,stars,reason};
  const prev=S.best[S.li];if(!prev||res.score>prev.score)S.best[S.li]=res;
  reason==='win'?sfx.win():sfx.lose();
  showLevelResult(res);
}
function showLevelResult(res){
  const L=LEVELS[S.li],n=NSP(L);
  const head={win:['¡Nivel superado!','Encontraste todos los riesgos. Así se cuida una casa, una calle o una escuela.','win'],
    time:['Se acabó el tiempo','Mira qué riesgos se te pasaron y qué hacer en cada caso.','lost'],
    bulbs:['¡Se fueron las luces!','Señalaste demasiadas cosas seguras. Repasa lo que se te pasó.','lost']}[res.reason];
  const rows=L.spots.filter(s=>s.type==='hazard').map(s=>{const ok=res.found.includes(s.id);
    return `<li><details ${ok?'':'open'}><summary><span class="chip ${ok?'ok':'miss'}">${ok?'Lo encontraste':'Se te pasó'}</span>${s.title}</summary><p><b>¿Qué puede pasar?</b> ${s.why}</p><p><b>Lo seguro:</b> ${s.do}</p></details></li>`}).join('');
  const last=S.li>=LEVELS.length-1;
  show(`<section class="result"><div class="result-head ${head[2]}"><h2>${head[0]}</h2><p>${head[1]}</p>
  <div class="stars" role="img" aria-label="${res.stars} de 3 estrellas">${[0,1,2].map(i=>star(i<res.stars)).join('')}</div>
  <div class="stats"><div><b>${res.found.length} de ${n}</b><span>riesgos</span></div><div><b>${res.bulbs} de 3</b><span>luces</span></div><div><b>${res.score}</b><span>puntos</span></div></div>
  <div class="btn-row" style="margin-top:0"><button class="btn" id="next" type="button">${last?'Ir a la evaluación':'Siguiente nivel'}</button><button class="btn btn-ghost" id="retry" type="button">Repetir nivel</button></div></div>
  <h3 class="sec">Repaso del nivel</h3><ul class="review">${rows}</ul></section>`);
  $('#next').addEventListener('click',()=>last?startQuiz():showIntro(S.li+1));
  $('#retry').addEventListener('click',()=>showIntro(S.li));
}

/* ---------- evaluación ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(){
  S.quiz={i:0,right:0,wrongTopics:[],items:QUIZ.map(q=>{const idx=shuffle(q.o.map((_,k)=>k));return {q,idx,pick:null}})};
  showQ();
}
function showQ(){
  const Q=S.quiz,it=Q.items[Q.i],letters=['A','B','C','D'];
  show(`<section class="quiz"><span class="pill">Evaluación</span><h2>Pregunta ${Q.i+1} de ${QUIZ.length}</h2>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${QUIZ.length}" aria-valuenow="${Q.i}"><i style="width:${Q.i/QUIZ.length*100}%"></i></div>
  <p class="qtext">${it.q.q}</p>
  <div class="opts" id="opts">${it.idx.map((k,p)=>`<button class="opt" type="button" data-k="${k}"><span class="k">${letters[p]}</span><span>${it.q.o[k]}</span></button>`).join('')}</div>
  <div id="fb"></div></section>`);
  $('#opts').addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b||it.pick!==null)return;
    it.pick=+b.dataset.k;const ok=it.pick===it.q.c;
    if(ok){Q.right++;sfx.ok()}else{Q.wrongTopics.push(it.q.t);sfx.bad()}
    document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===it.q.c)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    const last=Q.i>=QUIZ.length-1;
    $('#fb').innerHTML=`<div class="panel explain"><h4 style="margin:0 0 4px">${ok?'¡Correcto!':'Casi'}</h4><p>${it.q.e}</p><div class="btn-row"><button class="btn" id="nq" type="button">${last?'Ver mi resultado':'Siguiente'}</button></div></div>`;
    $('#nq').focus();
    $('#nq').addEventListener('click',()=>{if(last)showFinal();else{Q.i++;showQ()}});
  });
}

/* ---------- resultado final ---------- */
function showFinal(){
  const total=LEVELS.reduce((a,L)=>a+NSP(L),0);
  const found=S.best.reduce((a,r)=>a+(r?r.found.length:0),0);
  const pts=S.best.reduce((a,r)=>a+(r?r.score:0),0);
  const stars=S.best.reduce((a,r)=>a+(r?r.stars:0),0);
  const qr=S.quiz.right,qn=QUIZ.length;
  const pct=(found/total*.5+qr/qn*.5)*100;
  const rank=pct>=85?'Guardián de las luces':(pct>=65?'Aprendiz seguro':'Explorador en entrenamiento');
  const msg=pct>=85?'Reconoces los riesgos y sabes cómo actuar. Cuéntaselo a tu familia y a tus amigos.':(pct>=65?'Vas muy bien. Repasa los puntos de abajo y vuelve a jugar para subir de rango.':'Ya diste el primer paso. Repasa lo que se te pasó y vuelve a intentarlo.');
  const missed=[];LEVELS.forEach((L,i)=>{const r=S.best[i];if(r)r.missed.forEach(id=>{const s=L.spots.find(x=>x.id===id);missed.push(`<li>${s.title}: ${s.do}</li>`)})});
  const topics=[...new Set(S.quiz.wrongTopics)];
  const name=S.name||'Jugador';
  const text=`Soy ${name} y saqué el rango "${rank}" en ¡Que no se te vayan las luces!: ${found} de ${total} riesgos encontrados y ${qr} de ${qn} en la evaluación.`;
  show(`<section class="result"><div class="diploma">${chispa('chispa')}<p class="small">Diploma de seguridad eléctrica</p><p class="small">Se otorga a</p><div class="name">${esc(name)}</div>
  <div class="rank">${rank}</div><p>${msg}</p>
  <div class="stats" style="margin-top:14px"><div><b>${found} de ${total}</b><span>riesgos</span></div><div><b>${qr} de ${qn}</b><span>evaluación</span></div><div><b>${stars} de 9</b><span>estrellas</span></div></div>
  <p class="small">Puntos: ${pts} · Modo ${MODES[S.mode].label}</p></div>
  <h3 class="sec">Para repasar</h3>
  ${missed.length?`<ul class="review" style="padding-left:18px;list-style:disc;display:block">${missed.join('')}</ul>`:'<p>No se te pasó ningún riesgo. ¡Excelente!</p>'}
  ${topics.length?`<p style="margin-top:10px"><b>Temas de la evaluación por reforzar:</b> ${topics.join(', ')}.</p>`:''}
  <div class="btn-row"><button class="btn" id="again" type="button">Jugar de nuevo</button><button class="btn btn-ghost" id="copy" type="button">Copiar mi resultado</button></div>
  <div id="copyOut" aria-live="polite"></div>
  <p class="foot">Mensaje clave: si ves un riesgo eléctrico, no lo toques, aléjate y avisa a un adulto. En una emergencia en Colombia, llama al 123.</p></section>`);
  $('#again').addEventListener('click',showStart);

/* ---------- paradas ---------- */
function openGate(){
  const item=G.order[G.gi],g=item.g,L=['A','B','C'];
  $('#sheetTop2').className='sheet-top';
  $('#sheetTop2').innerHTML=`<span>Parada ${G.gi+1} de ${GATES.length}</span><span>${TRAMOS[Math.min(3,Math.floor(G.gi/2))]}</span>`;
  $('#sheetBody2').innerHTML=`<h3 id="sheetTitle">${g.n}</h3><div class="scn">${chispa('')}<p>${g.t}</p></div>
  <div class="opts" id="gopts">${item.idx.map((k,p)=>`<button class="opt" type="button" data-k="${k}"><span class="k">${L[p]}</span><span>${g.o[k]}</span></button>`).join('')}</div><div id="gfb"></div>`;
  $('#gopts').addEventListener('click',onAnswer);
  sheet.hidden=false;
}
function onAnswer(e){
  const b=e.target.closest('.opt');if(!b||b.disabled)return;
  const item=G.order[G.gi],g=item.g,pick=+b.dataset.k,ok=pick===g.c;
  document.querySelectorAll('#gopts .opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===g.c)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
  G.answers.push({gi:G.gi,ok,topic:g.topic,n:g.n});
  if(ok){G.score+=150;sfx.ok();burst(G.x,PY-30,PAL,40,300);G.react=1.2;G.reactOk=true}
  else{G.luces--;G.flash=1;sfx.bad();G.react=1;G.reactOk=false}
  $('#sheetTop2').className='sheet-top '+(ok?'ok':'bad');
  const last=G.gi>=GATES.length-1;
  $('#gfb').innerHTML=`<div class="box-do"><h4>${ok?'¡Muy bien!':'Casi. Esto es lo seguro'}${ok?'':'  ·  pierdes una luz'}</h4><p>${g.e}</p></div>
  ${(S.mode==='engineer'&&g.tech)?`<div class="box-tech"><h4>Dato técnico</h4><p>${g.tech}</p></div>`:''}
  <div class="btn-row" style="margin-top:12px"><button class="btn" id="gnext" type="button">${G.luces<=0?'Ver qué pasó':(last?'Llegar a la meta':'Seguir bailando')}</button></div>`;
  updateHUD();
  const nx=$('#gnext');nx.focus();
  nx.addEventListener('click',()=>{
    sheet.hidden=true;
    G.gi++;updateHUD();
    if(G.gi>=GATES.length){G.state='over';setTimeout(()=>showResult(true),600);return}
    if(G.luces<=0){G.state='over';sfx.lose();showResult(false);return}
    G.state='leave';G.target=G.M.speed;
    if(G.gi%2===0)toast(`<b>${TRAMOS[Math.floor(G.gi/2)]}.</b> El desfile sigue.`,3400);
  });
}

  const msg=pct>=85?'Reconoces los riesgos y sabes cómo actuar. Cuéntaselo a tu familia y a tus amigos.':(pct>=65?'Vas muy bien. Repasa los puntos de abajo y vuelve a bailar para subir de rango.':'Ya diste el primer paso. Repasa lo que se te pasó y vuelve a intentarlo.');

  const rows=G.order.map((it,i)=>{const a=G.answers.find(x=>x.gi===i);
    if(!a)return `<li><details><summary><span class="chip miss">No llegaste</span>${it.g.n}</summary><p>${it.g.e}</p></details></li>`;
    return `<li><details ${a.ok?'':'open'}><summary><span class="chip ${a.ok?'ok':'miss'}">${a.ok?'Acertaste':'A repasar'}</span>${it.g.n}</summary><p><b>Lo seguro:</b> ${it.g.o[it.g.c]}.</p><p>${it.g.e}</p></details></li>`}).join('');
  const hz=Object.keys(G.hits).map(k=>`<li><b>${HAZ[k].name}</b> (${G.hits[k]}): ${HAZ[k].msg}</li>`).join('');
  const text=`Soy ${name} y saqué el rango "${rank}" en Carnaval sin sustos: ${right} de ${total} paradas acertadas, ${hitsN} chispazos y ${G.bulbs} bombillos.`;
  const head=win?`<div class="diploma">${chispa('chispa')}<p class="small">Diploma de seguridad eléctrica</p><p class="small">Se otorga a</p><div class="name">${esc(name)}</div>
    <div class="rank">${rank}</div><p>${msg}</p>
    <div class="stats"><div><b>${right} de ${total}</b><span>paradas</span></div><div><b>${hitsN}</b><span>chispazos</span></div><div><b>${pts}</b><span>puntos</span></div></div>
    <p class="small">Modo ${MODES[S.mode].label}${G.retries?' · Apagones superados: '+G.retries:''}</p></div>`
   :`<div class="card"><h2>¡Se fueron las luces!</h2><p style="margin-top:8px">Llegaste hasta la parada ${Math.min(G.gi+1,total)} de ${total}. En la calle real, la mejor forma de no apagar las luces es alejarse de los riesgos. Puedes seguir desde esta parada con todas tus luces.</p>
    <div class="stats"><div><b>${right} de ${answered}</b><span>acertadas</span></div><div><b>${hitsN}</b><span>chispazos</span></div><div><b>${G.bulbs}</b><span>bombillos</span></div></div></div>`;
  show(`<section class="result">${head}
  <h3 class="sec">Repaso de las paradas</h3><ul class="review">${rows}</ul>
  ${hz?`<h3 class="sec">Tus chispazos en la calle</h3><ul class="panel-w" style="margin:0;padding-left:34px">${hz}</ul>`:''}
  <div class="btn-row">${win?'':`<button class="btn" id="resume" type="button">Seguir desde la parada ${Math.min(G.gi+1,total)}</button>`}<button class="btn ${win?'':'btn-alt'}" id="again" type="button">${win?'Bailar de nuevo':'Empezar de cero'}</button>${win?'<button class="btn btn-alt" id="copy" type="button">Copiar mi resultado</button>':''}<button class="btn btn-alt" id="home" type="button">Inicio</button></div>
  <div id="copyOut" aria-live="polite"></div>
  <p class="foot">Mensaje clave: si ves un riesgo eléctrico, no lo toques, aléjate y avisa a un adulto. En una emergencia en Colombia, llama al 123.</p></section>`);
  $('#again').addEventListener('click',()=>startGame());
  const rs=$('#resume');if(rs)rs.addEventListener('click',()=>startGame({gi:G.gi,answers:G.answers,hits:G.hits,score:G.score,bulbs:G.bulbs,retries:G.retries}));
  $('#home').addEventListener('click',()=>CS.home());
  const cp=$('#copy');
  if(cp)cp.addEventListener('click',async()=>{
    const out=$('#copyOut');
    try{await navigator.clipboard.writeText(text);out.innerHTML='<p class="copymsg">Resultado copiado.</p>'}
    catch(e){out.innerHTML=`<textarea class="copybox" readonly id="ctext">${esc(text)}</textarea>`;const t=$('#ctext');t.focus();t.select()}
  });
}


window.CS_G2={start:showStart,stop:function(){stopLoop();G=null;cv=null;sheet.hidden=true;sheetCb=null}};
})();
